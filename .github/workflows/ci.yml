name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Binary e2e tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binary
        run: go build -o /tmp/wait-for-health-check ./main.go

      - name: Publish image
        run: echo "::notice::Image built and pushed in docker-build job; tests run against local binary"

      - name: Test hold mode defaults
        run: |
          # Should start and be killable (not exit immediately)
          timeout 2 /tmp/wait-for-health-check hold || true

      - name: Test probe against closed port (exit 1)
        run: |
          TARGET_PORT=9999 /tmp/wait-for-health-check probe; echo "exit=$?"

      - name: Test probe mode exit code (should be 0 or 1, not 2)
        run: |
          /tmp/wait-for-health-check probe; code=$?; echo "exit=$code"; if [ "$code" -eq 2 ]; then echo "::error::probe exited with code 2"; exit 1; fi

      - name: Test invalid TARGET_PORT (should not crash with code 2)
        run: |
          TARGET_PORT=notanumber /tmp/wait-for-health-check probe 2>&1; code=$?; echo "exit=$code"

      - name: Test wait mode against reachable localhost
        run: |
          timeout 5 /tmp/wait-for-health-check || true

  docker-build:
    name: Docker build (multi-arch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase image name
        id: meta
        run: |
          REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${REPO_LC}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.IMAGE }}:latest
            ${{ steps.meta.outputs.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
