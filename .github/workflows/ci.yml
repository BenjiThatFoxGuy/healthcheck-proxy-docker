name: CI

on:
  push:
    branches: [main]
  pull_request:
  tags: ["*"]
  workflow_dispatch:

jobs:
  test:
    name: Binary e2e tests
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binary
        run: go build -o /tmp/wait-for-health-check ./main.go

      - name: Test hold mode defaults
        run: |
          # Should start and be killable (not exit immediately)
          timeout 2 /tmp/wait-for-health-check hold || true

      - name: Test probe against closed port (expect exit 1)
        run: |
          set +e
          TARGET_PORT=9999 /tmp/wait-for-health-check probe
          code=$?
          set -e
          echo "exit=$code"
          if [ "$code" -eq 2 ]; then echo "::error::probe exited with code 2 for closed port (should be 1)"; exit 1; fi

      - name: Test probe mode exit code (must be 0 or 1, never 2)
        run: |
          set +e
          /tmp/wait-for-health-check probe
          code=$?
          set -e
          echo "exit=$code"
          if [ "$code" -eq 2 ]; then echo "::error::probe exited with code 2"; exit 1; fi

      - name: Test invalid TARGET_PORT (should exit 2 with error)
        run: |
          set +e
          TARGET_PORT=notanumber /tmp/wait-for-health-check probe 2>&1
          code=$?
          set -e
          echo "exit=$code"
          if [ "$code" -ne 2 ]; then echo "::error::expected exit code 2 for bad TARGET_PORT, got $code"; exit 1; fi

      - name: Test wait mode against reachable localhost (expect exit 0 or timeout=124)
        run: |
          timeout 5 /tmp/wait-for-health-check || code=$?; echo "exit=${code:-0}"
