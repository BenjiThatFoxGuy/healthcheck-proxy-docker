name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch:

jobs:
  test:
    name: Test (Go)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Run Go unit tests
        run: go test -v ./...
      - name: Verify binary builds
        run: go build -o /dev/null .

  docker-build:
    name: Docker build (multi-arch)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/benjithatfoxguy/healthcheck-proxy-docker:latest
            ghcr.io/benjithatfoxguy/healthcheck-proxy-docker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
